# The spike lives on a network share where pnpm's symlinked virtual store fails
# ("The file or directory is not a reparse point", os error 4390), so use a flat node_modules.
nodeLinker: hoisted

# Run package scripts in pnpm's own shell, not cmd.exe: cmd.exe cannot use the share's UNC path as cwd.
shellEmulator: true

minimumReleaseAgeExclude:
  - pg-cloudflare@1.4.1
  - pg-connection-string@2.14.1
  - pg-protocol@1.16.1
  - pg@8.23.1
